# Unit tests (bats) run in GitHub Actions, not here: this pipeline reports no
# commit status to GitHub, so a failure would be invisible from the PR. The
# steps below drive the plugin at the commit under test, which does need a
# real agent — but they report nothing to GitHub either, so nothing gates on
# them and their result is unverified from here.
steps:
  - label: ":junit: Test junit-process"
    command: "echo 'Test run complete'"
    plugins:
      - mergifyio/mergify-ci#${BUILDKITE_COMMIT}:
          action: junit-process
          report_path: "zfixtures/junit_example.xml"
          mergify_api_url: "http://localhost:1080"

  - label: ":mag: Test scopes-git-refs"
    key: test-git-refs
    plugins:
      - mergifyio/mergify-ci#${BUILDKITE_COMMIT}:
          action: scopes-git-refs

  - label: ":upload: Test scopes-upload"
    depends_on: test-git-refs
    plugins:
      - mergifyio/mergify-ci#${BUILDKITE_COMMIT}:
          action: scopes-upload
          scopes: "backend,frontend"
          mergify_api_url: "http://localhost:1080"

  - label: ":mag: Test scopes"
    plugins:
      - mergifyio/mergify-ci#${BUILDKITE_COMMIT}:
          action: scopes
          mergify_api_url: "http://localhost:1080"
