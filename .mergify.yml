extends: .github

# The CI gate is the GitHub Actions `ci-gate` check (.github/workflows/ci.yaml).
# It covers the bats unit tests, which stub the CLI and the agent. The Buildkite
# pipeline is what drives the plugin as a plugin, but it reports no commit
# status / check-run to GitHub, so nothing here can observe it and that half
# stays ungated.

shared:
  check_runs: &CheckRuns
    - check-success=ci-gate
  default_review_cond: &DefaultReviewCond
    - "#approved-reviews-by>=2"
    - author = dependabot[bot]
    - author = renovate[bot]
    - author = mergify-ci-bot

queue_rules:
  - name: dependencies
    queue_conditions:
      - base=main
      - or:
          - author = renovate[bot]
          - author = dependabot[bot]
    merge_method: fast-forward
    batch_size: 7
    batch_max_wait_time: 5min
  - name: default
    queue_conditions:
      - base=main
    commit_message_format:
      title: pr-title
      body: pr-body
    merge_method: squash

pull_request_rules:
  - name: request review
    conditions:
      - -author=dependabot[bot]
      - -author=renovate[bot]
      - -author=mergify-ci-bot
      - -merged
      - -closed
      - "#approved-reviews-by=0"
      - "#changes-requested-reviews-by=0"
      - review-requested!=@devs
    actions:
      request_reviews:
        teams:
          - devs

merge_protections:
  - name: 🤖 Continuous Integration
    if: []
    success_conditions:
      - and: *CheckRuns
  - name: 👀 Review Requirements
    if: []
    success_conditions:
      - or: *DefaultReviewCond

merge_queue:
  max_parallel_checks: 5

merge_protections_settings:
  auto_merge_conditions: true
